name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run lint and format checks
        run: |
          ruff check .
          black --check .
          mypy app

  tests:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        env:
          PYTHONPATH: .
          CI_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          CI_JWT_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_KEY }}
        run: |
          if [ -z "$CI_DB_PASSWORD" ] || [ -z "$CI_JWT_SECRET_KEY" ]; then
            echo "Missing required repository secrets: CI_DB_PASSWORD and/or CI_JWT_SECRET_KEY"
            exit 1
          fi

          cat > .env <<EOF
          db_user=postgres
          db_password=${CI_DB_PASSWORD}
          db_name=monolith
          db_port=5432
          db_host=localhost
          jwt_secret_key=${CI_JWT_SECRET_KEY}
          EOF
          pytest -q --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
