name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# El gate se declara UNA vez en .harness/verify.toml.
# Esta workflow lo invoca. Si el CI re-declara ruff, mypy o pytest,
# tienes dos verdades y una miente.
#
# --when ci: corre la suite completa (format + lint + types + tests
# unit + integration + e2e + cobertura de rama con --cov-fail-under
# leido del pyproject.toml).
#
# El bloque 'quality' usa --when push: format + lint + types + tests
# unit (sin integration/e2e que necesitan DB).

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run quality gate (lint + types + unit tests)
        run: uv run python .harness/verify.py --root . --when push

  tests:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run full test suite
        env:
          CI_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          CI_JWT_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_KEY }}
        run: |
          if [ -z "$CI_DB_PASSWORD" ] || [ -z "$CI_JWT_SECRET_KEY" ]; then
            echo "Missing required repository secrets: CI_DB_PASSWORD and/or CI_JWT_SECRET_KEY"
            exit 1
          fi

          cat > .env <<EOF
          db_user=postgres
          db_password=${CI_DB_PASSWORD}
          db_name=monolith
          db_port=5432
          db_host=localhost
          jwt_secret_key=${CI_JWT_SECRET_KEY}
          EOF

          uv run python .harness/verify.py --root . --when ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
